@if(metrics()) {
<p-chart type="bar" [data]="basicData" [options]="basicOptions" />

} @else {
<div class="flex items-center justify-center py-8">
    <p-progress-spinner
        strokeWidth="8"
        fill="transparent"
        animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }"
    />
</div>
}
