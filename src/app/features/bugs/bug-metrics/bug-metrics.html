@if (loading()) {
<div class="flex items-center justify-center py-8">
    <p-progress-spinner
        strokeWidth="8"
        fill="transparent"
        animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }"
    />
</div>
} @else {
<div>
    <h1>Bug count: {{ bugCount() }}</h1>
    <app-bar-chart [metrics]="bugMetrics()" /> <app-polar-chart [metrics]="bugsPerTeamMetrics()" />
</div>
}
