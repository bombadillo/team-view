@if (loading()) {
<div class="flex items-center justify-center py-8">
    <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }" />
</div>
} @else {
<div>
    <div>
        <h1>Ticket count: {{ ticketCount() }}</h1>
        <app-bar-chart [metrics]="ticketMetrics()" />
    </div>
    <div>
        <h1>By team</h1> <app-polar-chart [metrics]="ticketsPerTeamMetrics()" />
    </div>
    <div>
        <h1>By User</h1>
        @if(ticketsPerUserMetrics() && ticketRevisionLoadPercentage() === 100) {
        <app-bar-chart [metrics]="ticketsPerUserMetrics()!" />
        } @else {
            <p-progressbar [value]="ticketRevisionLoadPercentage()" />
        }
    </div>
</div>
}
