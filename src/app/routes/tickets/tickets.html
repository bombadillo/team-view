<div class="container mx-auto px-4 py-8 text-gray-600 h-screen overflow-hidden box-border">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-full">
        <!-- Column 1 - Bug Tickets -->
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col">
            <h2 class="text-xl font-semibold mb-4">Tickets</h2>
            <div class="mt-4 flex-1 overflow-auto max-h-[calc(100vh-10rem)]">
                <app-ticket-list />
            </div>
        </div>

        <!-- Column 2 -->
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col">
            <h2 class="text-xl font-semibold mb-4">Stats</h2>
            <div class="mt-4 flex-1 overflow-auto max-h-[calc(100vh-10rem)]">
                <app-ticket-metrics />
            </div>
        </div>

        <!-- Column 3 -->
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col">
            <h2 class="text-xl font-semibold mb-4">?</h2>
            <div class="mt-4 flex-1 overflow-auto max-h-[calc(100vh-10rem)]">
            </div>
        </div>
    </div>
</div>
